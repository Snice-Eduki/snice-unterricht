<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Instagram verbinden</title><style>body{font-family:system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#222;background:#fff}a{color:#d62976}</style></head>
<body><h2>Instagram wird verbunden …</h2><p id="t">Einen Moment, du wirst zu deiner Automatik im Heimnetz weitergeleitet.</p>
<script>
(function(){var q=new URLSearchParams(location.search),c=(q.get("code")||"").replace(/#_?$/,""),s=q.get("state")||"",e=q.get("error_description")||q.get("error");
var ziel="http://192.168.68.87:8101/ig_oauth?state="+encodeURIComponent(s)+(c?"&code="+encodeURIComponent(c):"&error="+encodeURIComponent(e||"abgebrochen"));
document.getElementById("t").innerHTML='Falls nichts passiert: <a href="'+ziel+'">hier klicken</a> (dein Gerät muss im Heim-WLAN sein).';
location.replace(ziel);})();
</script></body></html>
